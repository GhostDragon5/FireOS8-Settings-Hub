name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    name: Build APK and create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare version changelog
        run: |
          VERSION="1.1.${{ github.run_number }}"
          DATE="$(date -u +%F)"
          {
            echo "## [$VERSION] - $DATE"
            awk '/^## \[Unreleased\]/{inside=1; next} inside && /^## /{exit} inside{print}' CHANGELOG.md
          } > release_notes.md
          if [ "$(wc -l < release_notes.md)" -eq 1 ]; then
            echo "### Changed" >> release_notes.md
            git log -1 --format='- %s' >> release_notes.md
          fi
          {
            sed -n '1,3p' CHANGELOG.md
            cat release_notes.md
            sed -n '4,$p' CHANGELOG.md | awk '/^## \[Unreleased\]/{skip=1; next} skip && /^## /{skip=0} !skip{print}'
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Commit version changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "Update changelog for v1.1.${{ github.run_number }} [skip release]"
          git push

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed versioned APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lintVitalRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.1.${{ github.run_number }} \
            -PreleaseStoreFile="$RUNNER_TEMP/release.jks" \
            -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PreleaseKeyPassword="$KEYSTORE_PASSWORD"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: FireOS8 Settings Hub v1.1.${{ github.run_number }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/app-release.apk
